apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoscaler
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autoscaler
  template:
    metadata:
      labels:
        app: autoscaler
    spec:
      serviceAccountName: custom-hpa-sa
      containers:
        - name: autoscaler
          image: autoscaler:latest
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: autoscaler-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
