prometheus:
  prometheusSpec:
    scrapeInterval: 15s
    additionalScrapeConfigs:
      - job_name: dispatcher
        static_configs:
          - targets:
              - dispatcher-service.default.svc.cluster.local:8080
      - job_name: ml-replicas
        static_configs:
          - targets:
              - ml-replica-service.default.svc.cluster.local:8080
grafana:
  adminPassword: admin
